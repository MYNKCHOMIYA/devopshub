services:
  postgres:
    image: postgres:16
    container_name: devopshub_postgres
    restart: "no"

    environment:
      POSTGRES_DB: devopshub
      POSTGRES_USER: devopshub
      POSTGRES_PASSWORD: devopshub_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - devopshub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopshub -d devopshub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../app/backend

    container_name: devopshub_api
    restart: "no"

    environment:
      DATABASE_URL: postgresql+psycopg://devopshub:devopshub_dev_password@postgres:5432/devopshub

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devopshub_postgres_data:
